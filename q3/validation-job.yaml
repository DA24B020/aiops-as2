apiVersion: batch/v1
kind: Job
metadata:
  name: shard-validation
spec:
  completionMode: Indexed
  completions: 8
  parallelism: 4
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: shard-validation
    spec:
      restartPolicy: Never
      containers:
        - name: validator
          image: shard-validator:v1
          imagePullPolicy: IfNotPresent
          env:

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

            - name: WORK_SECONDS
              value: "30"
          resources:
            requests:
              cpu: "500m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
